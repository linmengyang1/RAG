[project]
name = "grad-rag-backend"
version = "0.1.0"
description = "研究生院知识库 RAG 后端"
requires-python = ">=3.11"
dependencies = [
    # Web 框架
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    # 配置与校验
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    # 数据库
    "sqlalchemy[asyncio]>=2.0.29",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # 向量库
    "pymilvus>=2.4.0",
    # 鉴权（注意：passlib 已停止维护，与 bcrypt>=4.0 不兼容，需锁定 bcrypt<4.0）
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=3.2,<4.0",
    # LLM / Agent
    "httpx>=0.27.0",
    "langgraph>=0.1.0",
    "langchain-core>=0.2.0",
    # 文档解析
    "pyyaml>=6.0.1",
    "python-frontmatter>=1.1.0",
    "pypdf>=4.2.0",
    "python-docx>=1.1.0",
    # 工具
    "tenacity>=8.2.3",
    "loguru>=0.7.2",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
# GPU 推理依赖（P1/P2 接入 Embedder/Reranker 时安装）
gpu = [
    "sentence-transformers>=3.0.0",
    "FlagEmbedding>=1.2.10",
    "torch>=2.2.0",
    # transformers 必须锁 4.x：FlagEmbedding 1.4.0 的 FlagReranker.compute_score
    # 内部调用 XLMRobertaTokenizer.prepare_for_model，该方法在 transformers 5.x 已移除
    # 详见 backend/app/services/retrieval/reranker.py
    "transformers>=4.57,<5",
]
# 评测依赖（RAGAS 评测用，tests/eval_ragas.py）
# 锁定 ragas 0.4.x：用 LangchainLLMWrapper/LangchainEmbeddingsWrapper API
# 注意：ragas 0.2-0.4 都硬依赖 langchain_community.chat_models.vertexai，
# 该路径在 langchain-community 0.4+ 已移除（迁到 langchain-google-vertexai），
# 故必须锁定 langchain-community<0.4，否则 import ragas 报 ModuleNotFoundError
# langchain-openai: 用 DeepSeek 作为 RAGAS 评估 LLM（兼容 OpenAI 接口）
# langchain-huggingface: 用本地 BGE-M3 作为 RAGAS 评估 embeddings
eval = [
    "ragas>=0.4,<0.5",
    "langchain-community>=0.3,<0.4",
    "datasets>=2.0.0",
    "langchain-openai>=0.1.0",
    "langchain-huggingface>=0.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
