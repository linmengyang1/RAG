[project]
name = "grad-rag-backend"
version = "0.1.0"
description = "研究生院知识库 RAG 后端"
requires-python = ">=3.11"
dependencies = [
    # Web 框架
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    # 配置与校验
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    # 数据库
    "sqlalchemy[asyncio]>=2.0.29",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # 向量库
    "pymilvus>=2.4.0",
    # 鉴权（注意：passlib 已停止维护，与 bcrypt>=4.0 不兼容，需锁定 bcrypt<4.0）
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=3.2,<4.0",
    # LLM / Agent
    "httpx>=0.27.0",
    "langgraph>=0.1.0",
    "langchain-core>=0.2.0",
    # 文档解析
    "pyyaml>=6.0.1",
    "python-frontmatter>=1.1.0",
    "pypdf>=4.2.0",
    "python-docx>=1.1.0",
    # 工具
    "tenacity>=8.2.3",
    "loguru>=0.7.2",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
# GPU 推理依赖（P1/P2 接入 Embedder/Reranker 时安装）
gpu = [
    "sentence-transformers>=3.0.0",
    "FlagEmbedding>=1.2.10",
    "torch>=2.2.0",
]
# 评测依赖（P6 用）
eval = [
    "ragas>=0.1.0",
    "datasets>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
